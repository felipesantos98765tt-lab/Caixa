<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Senha - CAIXA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            background-color: #f0f0f0;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background-color: #ffffff;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 35px;
            width: auto;
        }

        .btn-sair {
            color: #005ca9;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        /* Conteúdo Principal */
        .main-content {
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #1d2124;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #5b6571;
            font-size: 18px;
            margin-bottom: 32px;
        }

        /* Input de Senha */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group label {
            position: absolute;
            top: 8px;
            left: 18px;
            font-size: 12px;
            color: #5b6571;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 24px 48px 8px 18px; /* Padding extra na direita para o ícone do olho */
            border: 1.5px solid #6b7a87;
            border-radius: 24px;
            font-size: 16px;
            color: #1d2124;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input:focus {
            border-color: #005ca9;
        }

        .eye-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 24px;
            height: 24px;
            fill: #5b6571;
            transition: fill 0.2s;
        }

        /* Link Esqueci a senha */
        .forgot-password {
            color: #005ca9;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 32px;
            display: inline-block;
        }

        /* Botão Entrar */
        .actions {
            display: flex;
            justify-content: flex-end;
        }

        /* Estado inicial do botão (desabilitado) */
        .btn-entrar {
            background-color: #ebf0f2;
            color: #9ab0bd;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }

        /* Estado ativo do botão */
        .btn-entrar.ativo {
            background-color: #F39200; /* Laranja da Caixa */
            color: #ffffff;
            cursor: pointer;
        }

        .btn-entrar.ativo:hover {
            background-color: #d88200;
        }

    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Cabeçalho com Logo e botão Sair -->
        <header class="header">
            <div class="logo">
                <a href="https://logo-teka.com/pt-br/caixa/">
                    <img src="https://logo-teka.com/wp-content/uploads/2026/07/caixa-icon-logo.svg" alt="SVG logo CAIXA" style="max-width:200px;" />
                </a>
            </div>
            <a href="index.html" class="btn-sair">Sair</a>
        </header>

        <!-- Área de Formulário -->
        <main class="main-content">
            <h1>Entrar</h1>
            <p class="subtitle">Informe sua senha</p>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password">
                
                <!-- Ícone de Olho -->
                <svg class="eye-icon" id="toggleSenha" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </div>

            <a href="#" class="forgot-password">Esqueci minha senha</a>

            <div class="actions">
                <button type="button" class="btn-entrar" id="btnEntrar" disabled>Entrar</button>
            </div>
        </main>
    </div>

    <!-- Script de Interação -->
    <script>
        const inputSenha = document.getElementById('senha');
        const btnEntrar = document.getElementById('btnEntrar');
        const toggleSenha = document.getElementById('toggleSenha');

        // Lógica para habilitar/desabilitar o botão Entrar
        inputSenha.addEventListener('input', function(e) {
            if (e.target.value.length > 0) {
                btnEntrar.disabled = false;
                btnEntrar.classList.add('ativo');
            } else {
                btnEntrar.disabled = true;
                btnEntrar.classList.remove('ativo');
            }
        });

        // Lógica para mostrar/ocultar a senha ao clicar no olho
        toggleSenha.addEventListener('click', function() {
            // Verifica o tipo atual do input (se for password, vira text, e vice-versa)
            const isPassword = inputSenha.getAttribute('type') === 'password';
            
            if (isPassword) {
                inputSenha.setAttribute('type', 'text');
                toggleSenha.style.fill = '#005ca9'; // Muda a cor para azul indicando que está visível
            } else {
                inputSenha.setAttribute('type', 'password');
                toggleSenha.style.fill = '#5b6571'; // Retorna para a cor cinza padrão
            }
        });
    </script>
</body>
</html>
